name: Heretic Reforged

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.4.1
  PROJECT: "."

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL --retry 4 -o /tmp/godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 4 -o /tmp/templates.tpz $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/version.txt' 'templates/web_nothreads_*' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' 'templates/macos.zip' \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path $PROJECT --import

      - name: Tests
        run: |
          set -e
          ~/godot/godot --headless --path $PROJECT -s res://tests/triangulation_test.gd
          ~/godot/godot --headless --path $PROJECT res://tests/smoke_test.tscn
          curl -fsSL --retry 4 -o /tmp/freedoom.zip https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
          unzip -q -j /tmp/freedoom.zip '*/freedoom1.wad' -d /tmp
          ~/godot/godot --headless --path $PROJECT -s res://tests/wad_map_test.gd -- --wad=/tmp/freedoom1.wad

      - name: Export
        run: |
          set -e
          mkdir -p $PROJECT/build/web $PROJECT/build/windows $PROJECT/build/macos
          ~/godot/godot --headless --path $PROJECT --export-release "Web" build/web/index.html
          ~/godot/godot --headless --path $PROJECT --export-release "Windows" build/windows/HereticReforged.exe
          ~/godot/godot --headless --path $PROJECT --export-release "macOS" build/macos/HereticReforged.zip
          test -f $PROJECT/build/web/index.wasm
          test -f $PROJECT/build/windows/HereticReforged.exe
          test -f $PROJECT/build/macos/HereticReforged.zip

      - uses: actions/upload-artifact@v4
        with:
          name: heretic-reforged-web
          path: ${{ env.PROJECT }}/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: heretic-reforged-windows
          path: ${{ env.PROJECT }}/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: heretic-reforged-macos
          path: ${{ env.PROJECT }}/build/macos

      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT }}/build/web

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
